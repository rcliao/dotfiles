name: chezmoi

# Every bug this catches was found by hand first: a config template that broke
# `chezmoi init` outright, a failing package script that aborted apply before
# anything was written, and repo docs deploying into the home directory. All of
# them rendered fine — only actually applying to a clean machine exposed them.

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly, so upstream drift (a formula disappearing, a cask needing trust)
    # surfaces on its own rather than during a real machine setup.
    - cron: "0 16 * * 5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    # macOS, not Ubuntu: the package script is guarded on
    # `eq .chezmoi.os "darwin"`, so on Linux it renders to an empty file and
    # shellchecking it is a silent no-op that reports success without ever
    # looking at the script.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install chezmoi and shellcheck
        run: brew install chezmoi shellcheck

      - name: shellcheck the hook scripts
        # -S error only: these scripts predate CI and trip a pile of style and
        # info findings (SC2086 where word splitting is deliberate, SC2002,
        # SC2181). Gate on things that actually break, not on style.
        run: shellcheck -S error dot_claude/hooks/executable_*.sh

      - name: shellcheck the rendered package script
        run: |
          chezmoi execute-template --source="$GITHUB_WORKSPACE" \
            < run_onchange_before_install-packages-darwin.sh.tmpl > /tmp/pkg.sh
          # Guard against the check quietly passing on an empty render.
          [ -s /tmp/pkg.sh ] || { echo "::error::package script rendered empty"; exit 1; }
          shellcheck -S error /tmp/pkg.sh

      - name: Every Brewfile name resolves
        # The `packages` job installs for real, but it only runs weekly and on
        # dispatch, so a formula disappearing from homebrew/core stayed
        # invisible for as long as a week — and `brew bundle` aborts the entire
        # batch on one unresolvable name, so the cost is every package, not one.
        # Resolving a name is cheap where installing is not, which is why this
        # lives here and runs on every push.
        #
        # Trust is deliberately not enforced: this step asks "does this name
        # exist", and listing a tap in the Brewfile is itself the repo-level
        # decision to use it. Whether a machine has run `brew trust` is a
        # per-machine matter, and the weekly `brew bundle check` covers it.
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
        run: |
          taps=$(sed -n 's/^tap "\([^"]*\)".*/\1/p' Brewfile)
          formulae=$(sed -n 's/^brew "\([^"]*\)".*/\1/p' Brewfile)
          casks=$(sed -n 's/^cask "\([^"]*\)".*/\1/p' Brewfile)

          # `while read` rather than `for n in $list`: the latter depends on
          # word-splitting an unquoted variable, which differs between shells.
          # `</dev/null` on every brew call, because a child that reads stdin
          # consumes the rest of the list and silently ends the loop after one
          # iteration — a truncated run that still exits 0.
          while IFS= read -r t; do
              brew tap "$t" </dev/null
          done < <(printf '%s\n' "$taps" | grep .)

          fail=0 checked=0
          while IFS= read -r n; do
              checked=$((checked + 1))
              brew info --formula "$n" >/dev/null 2>&1 </dev/null \
                || { echo "::error file=Brewfile::formula \"$n\" does not resolve"; fail=1; }
          done < <(printf '%s\n' "$formulae" | grep .)

          while IFS= read -r n; do
              checked=$((checked + 1))
              brew info --cask "$n" >/dev/null 2>&1 </dev/null \
                || { echo "::error file=Brewfile::cask \"$n\" does not resolve"; fail=1; }
          done < <(printf '%s\n' "$casks" | grep .)

          # Everything above is silent when it passes, which is indistinguishable
          # in the log from a loop that never ran. Report the counts and require
          # them to match, so a parse that yields nothing fails loudly instead of
          # reporting success without having looked at a single entry.
          expected=$(printf '%s\n%s\n' "$formulae" "$casks" | grep -c .)
          echo "checked $checked entries ($(echo "$taps" | grep -c .) taps tapped), expected $expected"
          [ "$checked" -eq "$expected" ] && [ "$checked" -gt 0 ] \
            || { echo "::error::Brewfile parse produced $checked of $expected entries"; exit 1; }

          exit "$fail"

      - name: Every template parses
        run: |
          fail=0
          while IFS= read -r tmpl; do
              # .chezmoi.toml.tmpl uses promptStringOnce, which is only valid in
              # `chezmoi init` context — the bootstrap job covers that one.
              case "$tmpl" in */.chezmoi.toml.tmpl) continue ;; esac
              if ! chezmoi execute-template --source="$GITHUB_WORKSPACE" < "$tmpl" > /dev/null; then
                  echo "::error file=$tmpl::template failed to render"
                  fail=1
              fi
          done < <(find . -name '*.tmpl' -type f -not -path './.git/*')
          # the modify_ script is a template without the .tmpl suffix
          if ! chezmoi execute-template --source="$GITHUB_WORKSPACE" \
                 < dot_claude/modify_private_settings.json > /dev/null; then
              echo "::error::modify_private_settings.json failed to render"
              fail=1
          fi
          exit "$fail"

  bootstrap:
    name: init --apply (${{ matrix.os }}, ghost=${{ matrix.ghost }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        ghost: ["false", "true"]
    steps:
      - uses: actions/checkout@v4

      - name: Install chezmoi
        run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"

      - name: chezmoi init --apply into a throwaway home
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          dest="$(mktemp -d)"; cfgdir="$(mktemp -d)"
          echo "DEST=$dest" >> "$GITHUB_ENV"
          echo "CFG=$cfgdir/chezmoi.toml" >> "$GITHUB_ENV"
          # sourceDir/destDir are NOT put in this file on purpose: `chezmoi init`
          # regenerates the config from .chezmoi.toml.tmpl, which only emits
          # [data]. Anything else here is silently dropped, and the next command
          # then falls back to the real source dir and the real $HOME. Always
          # pass --source/--destination explicitly.
          cat > "$cfgdir/chezmoi.toml" <<EOF
          [data]
              name = "CI Runner"
              email = "ci@example.com"
              ghost = ${{ matrix.ghost }}
          EOF
          # --exclude=scripts keeps this fast; the packages job covers the rest.
          chezmoi --config "$cfgdir/chezmoi.toml" \
            --source="$GITHUB_WORKSPACE" --destination="$dest" \
            init --apply --promptDefaults --exclude=scripts

      - name: Apply is idempotent
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          chezmoi --config "$CFG" --source="$GITHUB_WORKSPACE" --destination="$DEST" \
            apply --exclude=scripts

      - name: Expected targets exist
        run: |
          for f in .zshrc .gitconfig .ssh/config .claude/settings.json \
                   .claude/CLAUDE.md .config/herdr/config.toml .config/git/ignore; do
              [ -f "$DEST/$f" ] || { echo "::error::missing $f"; exit 1; }
          done

      - name: Repo docs did not leak into the home directory
        run: |
          for f in README.md CLAUDE.md Brewfile; do
              [ -f "$DEST/$f" ] && { echo "::error::$f was deployed to \$HOME"; exit 1; }
          done
          exit 0

      - name: settings.json is valid JSON and Ghost gating is correct
        run: |
          jq empty "$DEST/.claude/settings.json"
          refs=$(grep -c ghost "$DEST/.claude/settings.json" || true)
          scripts=$(ls "$DEST/.claude/hooks/" 2>/dev/null | grep -c ghost || true)
          echo "ghost refs=$refs scripts=$scripts (flag=${{ matrix.ghost }})"
          if [ "${{ matrix.ghost }}" = "true" ]; then
              [ "$refs" -gt 0 ] && [ "$scripts" -eq 5 ]
          else
              # With the flag off neither the hooks nor their scripts may appear,
              # and PreCompact — which only ever held a Ghost hook — must be gone
              # rather than left as an empty array.
              [ "$refs" -eq 0 ] && [ "$scripts" -eq 0 ] \
                && [ "$(jq '.hooks | has("PreCompact")' "$DEST/.claude/settings.json")" = "false" ]
          fi

      - name: modify_ merge preserves keys this repo does not track
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          # settings.json is a modify_ template precisely so Claude Code's own
          # edits, and machine-local plugins kept out of this public repo, are
          # not wiped on every apply. Prove it still merges rather than replaces.
          tmp="$(mktemp)"
          jq '.enabledPlugins["ci-only-plugin"] = true | .ciOnlyState = {"keep": 1}' \
            "$DEST/.claude/settings.json" > "$tmp"
          mv "$tmp" "$DEST/.claude/settings.json"
          # No target argument: a path passed to apply is resolved against the
          # real destDir, not the one in --config, so it would be rejected as
          # "not in destination directory".
          chezmoi --config "$CFG" --source="$GITHUB_WORKSPACE" --destination="$DEST" \
            apply --force --exclude=scripts
          jq -e '.enabledPlugins["ci-only-plugin"] == true and .ciOnlyState.keep == 1' \
            "$DEST/.claude/settings.json" > /dev/null \
            || { echo "::error::modify_ merge dropped untracked keys"; exit 1; }

  packages:
    name: brew bundle (macOS)
    runs-on: macos-latest
    # Slow and network-dependent, so it is not gating on every push.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Install chezmoi
        run: brew install chezmoi

      - name: Full init --apply with the package script enabled
        run: |
          dest="$(mktemp -d)"; cfgdir="$(mktemp -d)"
          cat > "$cfgdir/chezmoi.toml" <<EOF
          [data]
              name = "CI Runner"
              email = "ci@example.com"
              ghost = false
          EOF
          chezmoi --config "$cfgdir/chezmoi.toml" \
            --source="$GITHUB_WORKSPACE" --destination="$dest" \
            init --apply --promptDefaults
          echo "CFG=$cfgdir/chezmoi.toml" >> "$GITHUB_ENV"
          echo "DEST=$dest" >> "$GITHUB_ENV"

      - name: The package script actually ran
        run: |
          chezmoi --config "$CFG" --source="$GITHUB_WORKSPACE" --destination="$DEST" \
            state get-bucket --bucket=scriptState \
            | grep -q 'install-packages-darwin.sh' \
            || { echo "::error::package script was not recorded as run"; exit 1; }

      - name: Every Brewfile entry resolves and installed
        # The check above only proves the script ran. It cannot fail on a broken
        # Brewfile: the script deliberately swallows a `brew bundle` failure and
        # exits 0 so a bad package can never abort the apply, and chezmoi records
        # any zero-exit script as run. So the assertion passed while `terraform`
        # had been removed from homebrew/core, `brew bundle` aborted the whole
        # batch on the unresolvable name, and *nothing* was installed.
        #
        # `brew bundle check` asserts the outcome instead, and exits non-zero
        # when any entry is unresolvable or missing — including the tap-trust
        # case, where an untrusted entry is silently ignored rather than failing.
        run: |
          if ! brew bundle check --file="$GITHUB_WORKSPACE/Brewfile" --verbose; then
              echo "::error::Brewfile entries unresolved or uninstalled (see above)"
              exit 1
          fi
